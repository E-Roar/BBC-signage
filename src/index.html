<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BRAVEN Business Center — 8th Wall Studio AR</title>
  
  <meta name="theme-color" content="#E5B84B">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <!-- 8th Wall Studio Runtime & XR Engine -->
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="slam, image">
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'racing-title': ['Orbitron', 'Chakra Petch', 'sans-serif'],
            'racing-hud': ['Chakra Petch', 'Rajdhani', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden">
  <div id="root"></div>
  <script src="bundle.js"></script>
</body>
</html>
